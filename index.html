<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GaonBazar</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#0b7a3b;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0}
.search{
  padding:15px;
  background:white;
}
.search input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}
.container{padding:15px}
h2{margin-top:5px}
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:white;
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
}
.card .pic{
  height:120px;
  background:#eee;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}
.card h3{font-size:16px;margin:10px 0 5px}
.price{
  font-size:18px;
  font-weight:bold;
  color:#0b7a3b;
}
button{
  width:100%;
  border:0;
  padding:11px;
  margin-top:8px;
  border-radius:7px;
  background:#0b7a3b;
  color:white;
  font-size:15px;
}
.sell{
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:10px;
}
footer{
  margin-top:20px;
  background:#222;
  color:white;
  text-align:center;
  padding:18px;
}
</style>
</head>

<body>

<header>
  <h1>🛒 GaonBazar</h1>
  <p>Apne gaon ka apna online bazaar</p>
</header>

<div class="search">
  <input type="text" placeholder="🔍 Product search kare...">
</div>

<div class="container">
  <h2>Popular Products</h2>

  <div class="products">

    <div class="card">
      <div class="pic">👕</div>
      <h3>Stylish Shirt</h3>
      <div class="price">₹599</div>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <div class="pic">📱</div>
      <h3>Mobile Cover</h3>
      <div class="price">₹199</div>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <div class="pic">🍳</div>
      <h3>Kitchen Product</h3>
      <div class="price">₹299</div>
      <button>Buy Now</button>
    </div>

    <div class="card">
      <div class="pic">👜</div>
      <h3>Fashion Item</h3>
      <div class="price">₹399</div>
      <button>Buy Now</button>
    </div>

  </div>

  <div class="sell">
    <h2>🏪 Dukandar ke liye</h2>
    <p>Apna product GaonBazar par sell karein.</p>
    <button>Sell Your Product</button>
  </div>
</div>

<footer>
  © 2026 GaonBazar
</footer>

</body>
</html>
