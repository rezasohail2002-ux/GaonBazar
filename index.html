<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GaonBazar</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8;color:#222}
header{background:#087f3f;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:5px 0}

nav{display:flex;background:white;box-shadow:0 2px 8px #ddd}
nav button{flex:1;border:0;background:white;color:#087f3f;padding:14px 5px;font-weight:bold}

.page{padding:15px}
.search{background:white;padding:12px;margin-bottom:15px}
input,textarea,select{
 width:100%;padding:12px;margin:7px 0 12px;
 border:1px solid #ccc;border-radius:8px;font-size:15px
}

.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:12px;padding:10px;box-shadow:0 2px 8px #ddd}
.pic{height:120px;background:#eee;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:50px}
.card h3{font-size:16px;margin:8px 0}
.price{font-size:19px;font-weight:bold;color:#087f3f}
.small{font-size:13px;color:#666}

.btn{
width:100%;padding:12px;border:0;border-radius:8px;
background:#087f3f;color:white;font-weight:bold;margin-top:6px
}
.buy{background:#ff7200}
.hidden{display:none}

.box{
background:white;padding:16px;border-radius:12px;
box-shadow:0 2px 8px #ddd;margin-bottom:15px
}

.order{
background:#fff;padding:15px;border-radius:10px;
margin-top:10px;border-left:4px solid #087f3f
}

footer{background:#222;color:white;text-align:center;padding:20px;margin-top:20px}
</style>
</head>

<body>

<header>
<h1>🛒 GaonBazar</h1>
<p>Apne gaon ka apna online bazaar</p>
</header>

<nav>
<button onclick="showPage('home')">🏠 Home</button>
<button onclick="showPage('seller')">🏪 Seller</button>
<button onclick="showPage('orders')">📦 Orders</button>
</nav>

<!-- HOME -->
<div id="home" class="page">

<div class="search">
<input id="search" type="text" placeholder="🔍 Product search kare..." oninput="displayProducts()">
</div>

<h2>🛒 Products</h2>
<div id="products" class="products"></div>

</div>


<!-- SELLER -->
<div id="seller" class="page hidden">

<div class="box">
<h2>🏪 Seller Panel</h2>
<p>Apna product GaonBazar par list karein.</p>

<input id="sellerName" placeholder="Dukandar ka naam">

<input id="productName" placeholder="Product ka naam">

<input id="productPrice" type="number" placeholder="Product price ₹">

<select id="productIcon">
<option value="👕">👕 Fashion</option>
<option value="📱">📱 Mobile</option>
<option value="🍳">🍳 Kitchen</option>
<option value="👜">👜 Bag</option>
<option value="👟">👟 Shoes</option>
<option value="🏠">🏠 Home</option>
</select>

<textarea id="productDescription" placeholder="Product description"></textarea>

<button class="btn" onclick="addProduct()">➕ Product List Kare</button>
</div>

<div class="box">
<h3>📋 Aapke Listed Products</h3>
<div id="sellerProducts"></div>
</div>

</div>


<!-- ORDERS -->
<div id="orders" class="page hidden">

<div class="box">
<h2>📦 Orders</h2>
<div id="ordersList"></div>
</div>

</div>


<!-- BUY FORM -->
<div id="buyPage" class="page hidden">

<div class="box">
<h2>🛍️ Order Kare</h2>

<h3 id="buyProduct"></h3>
<p id="buyPrice"></p>

<input id="customerName" placeholder="Aapka naam">

<input id="customerMobile" type="tel" placeholder="Mobile number">

<textarea id="customerAddress" placeholder="Pura delivery address"></textarea>

<input id="customerQty" type="number" value="1" min="1" placeholder="Quantity">

<button class="btn buy" onclick="placeOrder()">📦 Order Submit Kare</button>

<button class="btn" onclick="showPage('home')">← Back to Products</button>
</div>

</div>


<footer>
© 2026 GaonBazar
<br>
Local Seller • Local Customer • Online Shopping
</footer>


<script>

let products = JSON.parse(localStorage.getItem("gaonProducts")) || [

{
id:1,
name:"Stylish Shirt",
price:599,
icon:"👕",
seller:"GaonBazar",
description:"Stylish comfortable shirt"
},

{
id:2,
name:"Mobile Cover",
price:199,
icon:"📱",
seller:"GaonBazar",
description:"Premium mobile cover"
},

{
id:3,
name:"Kitchen Product",
price:299,
icon:"🍳",
seller:"GaonBazar",
description:"Useful kitchen product"
}

];

let orders = JSON.parse(localStorage.getItem("gaonOrders")) || [];

let selectedProduct = null;


function saveProducts(){
localStorage.setItem("gaonProducts",JSON.stringify(products));
}


function saveOrders(){
localStorage.setItem("gaonOrders",JSON.stringify(orders));
}


function displayProducts(){

let search=document.getElementById("search").value.toLowerCase();

let list=products.filter(p =>
p.name.toLowerCase().includes(search)
);

let html="";

list.forEach(p=>{

html+=`
<div class="card">

<div class="pic">${p.icon}</div>

<h3>${p.name}</h3>

<div class="price">₹${p.price}</div>

<p class="small">🏪 ${p.seller}</p>

<p class="small">${p.description}</p>

<button class="btn buy" onclick="openBuy(${p.id})">
🛍️ Buy Now
</button>

</div>
`;

});

document.getElementById("products").innerHTML=html;

}


function showPage(page){

document.getElementById("home").classList.add("hidden");
document.getElementById("seller").classList.add("hidden");
document.getElementById("orders").classList.add("hidden");
document.getElementById("buyPage").classList.add("hidden");

document.getElementById(page).classList.remove("hidden");

if(page==="home") displayProducts();
if(page==="seller") displaySellerProducts();
if(page==="orders") displayOrders();

window.scrollTo(0,0);
}


function addProduct(){

let seller=document.getElementById("sellerName").value.trim();
let name=document.getElementById("productName").value.trim();
let price=document.getElementById("productPrice").value;
let icon=document.getElementById("productIcon").value;
let description=document.getElementById("productDescription").value.trim();

if(!seller || !name || !price){

alert("Seller name, product name aur price bhariye.");

return;
}

let product={

id:Date.now(),
name:name,
price:Number(price),
icon:icon,
seller:seller,
description:description || "Quality product"

};

products.push(product);

saveProducts();

document.getElementById("sellerName").value="";
document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productDescription").value="";

alert("✅ Product successfully list ho gaya!");

displaySellerProducts();
displayProducts();

}


function displaySellerProducts(){

let box=document.getElementById("sellerProducts");

if(products.length===0){

box.innerHTML="<p>Abhi koi product nahi hai.</p>";
return;

}

box.innerHTML=products.map(p=>`

<div class="order">

<b>${p.icon} ${p.name}</b>

<br>
₹${p.price}

<br>
<span class="small">Seller: ${p.seller}</span>

</div>

`).join("");

}


function openBuy(id){

selectedProduct=products.find(p=>p.id===id);

if(!selectedProduct)return;

document.getElementById("buyProduct").innerText=
selectedProduct.icon+" "+selectedProduct.name;

document.getElementById("buyPrice").innerText=
"Price: ₹"+selectedProduct.price;

showPage("buyPage");

}


function placeOrder(){

if(!selectedProduct)return;

let name=document.getElementById("customerName").value.trim();
let mobile=document.getElementById("customerMobile").value.trim();
let address=document.getElementById("customerAddress").value.trim();
let qty=Number(document.getElementById("customerQty").value);

if(!name || !mobile || !address || qty<1){

alert("Please sabhi customer details bhariye.");

return;

}

let order={

id:Date.now(),
product:selectedProduct.name,
seller:selectedProduct.seller,
price:selectedProduct.price,
quantity:qty,
total:selectedProduct.price*qty,
customer:name,
mobile:mobile,
address:address,
date:new Date().toLocaleString()

};

orders.push(order);

saveOrders();

alert("🎉 Order successfully submit ho gaya!");

document.getElementById("customerName").value="";
document.getElementById("customerMobile").value="";
document.getElementById("customerAddress").value="";
document.getElementById("customerQty").value=1;

showPage("orders");

}


function displayOrders(){

let box=document.getElementById("ordersList");

if(orders.length===0){

box.innerHTML="<p>Abhi koi order nahi hai.</p>";
return;

}

box.innerHTML=orders.slice().reverse().map(o=>`

<div class="order">

<b>📦 ${o.product}</b>

<p>Quantity: ${o.quantity}</p>

<p>Total: <b>₹${o.total}</b></p>

<p>Customer: ${o.customer}</p>

<p>Mobile: ${o.mobile}</p>

<p>Address: ${o.address}</p>

<p class="small">Seller: ${o.seller}</p>

<p class="small">${o.date}</p>

</div>

`).join("");

}


displayProducts();

</script>

</body>
</html> <footer>
  © 2026 GaonBazar<br>
  Founder by Imteyaz Sohail
</footer>
